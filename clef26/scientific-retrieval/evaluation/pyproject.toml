[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluate"]

[project]
name = "evaluation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.0",
    "ir-measures>=0.4.3",
    "isort>=8.0.1",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "pyterrier>=1.0.1",
    "repro-eval>=0.5.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tira>=0.0.200",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
